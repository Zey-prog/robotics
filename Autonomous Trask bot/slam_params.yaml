slam_toolbox:
  ros__parameters:

    incremental_mapping: true

    map_publish_period: 0.5
    map_update_interval: 0.5
    
    minimum_travel_distance: 0.01
    minimum_travel_heading: 0.01

    use_odometry: false
    use_scan_matching: true

    use_imu: true
    imu_topic: /imu/data
    imu_frame: imu_link

    scan_topic: /scan

    base_frame: base_link
    odom_frame: odom
    map_frame: map

    resolution: 0.05

    transform_publish_period: 0.02
    tf_buffer_duration: 120.0
    transform_timeout: 0.5

    scan_queue_size: 100

    # Laser limits
    min_laser_range: 0.12
    max_laser_range: 12.0

    # Motion update thresholds
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05

    # Loop closure = drift killer
    do_loop_closing: true
    loop_search_maximum_distance: 3.0

