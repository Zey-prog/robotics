slam_toolbox:
  ros__parameters:
    incremental_mapping: true
    map_publish_period: 0.5
    map_update_interval: 0.5
    use_odometry: false
    use_scan_matching: true
    use_imu: true
    imu_topic: /imu
    scan_topic: /scan
    base_frame: base_link
    odom_frame: odom
    map_frame: map
    resolution: 0.05
    transform_publish_period: 0.02
    tf_buffer_duration: 60.0
